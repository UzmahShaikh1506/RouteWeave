# RouteWeave Nginx Configuration
# Serves the client static files and proxies API requests to the backend.

# Per-IP request throttling for the API proxy (http context; conf.d files
# are included inside http {}). Admin gets a tighter budget to slow down
# key guessing; the API itself also locks out repeated auth failures.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=2r/s;

server {
    listen 80;
    server_name localhost;

    # Don't advertise the nginx version
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Legacy XSS auditor is removed from browsers and can itself cause leaks; CSP replaces it
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # No inline scripts allowed; Leaflet is pinned with SRI hashes in the HTML.
    # style-src keeps 'unsafe-inline' because Leaflet positions tiles/markers with inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    # Add once TLS is terminated in front of this server:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve static client files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Always revalidate HTML/CSS/JS so UI updates show without a hard refresh
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        expires -1;
        alias /usr/share/nginx/html/admin.html;
        default_type text/html;
    }

    location /admin.css {
        expires -1;
        alias /usr/share/nginx/html/admin.css;
        default_type text/css;
    }

    location /admin.js {
        expires -1;
        alias /usr/share/nginx/html/admin.js;
        default_type application/javascript;
    }

    # Admin API: tighter throttle, never cached
    location /api/admin/ {
        limit_req zone=admin_zone burst=10 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        # The API sets these itself; drop its copies so nginx's are the only ones sent
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Proxy API requests to the backend API service
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        # Resolve "api" through Docker's DNS at request time, so a rebuilt or
        # restarted API container (new IP) doesn't leave nginx with a stale
        # address. Using a variable in proxy_pass forces runtime resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        # The API sets these itself; drop its copies so nginx's are the only ones sent
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_buffering off;  # stream SSE events immediately
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running geocoding/optimization
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Allow file uploads up to 5MB
        client_max_body_size 5m;
    }

    # Health check for this container
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
