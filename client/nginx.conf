# RouteWeave Nginx Configuration
# Serves the client static files and proxies API requests to the backend.

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8000; frame-ancestors 'none';" always;

    # Serve static client files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Always revalidate HTML/CSS/JS so UI updates show without a hard refresh
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        expires -1;
        alias /usr/share/nginx/html/admin.html;
        default_type text/html;
    }

    location /admin.css {
        expires -1;
        alias /usr/share/nginx/html/admin.css;
        default_type text/css;
    }

    location /admin.js {
        expires -1;
        alias /usr/share/nginx/html/admin.js;
        default_type application/javascript;
    }

    # Proxy API requests to the backend API service
    location /api/ {
        # Resolve "api" through Docker's DNS at request time, so a rebuilt or
        # restarted API container (new IP) doesn't leave nginx with a stale
        # address. Using a variable in proxy_pass forces runtime resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_buffering off;  # stream SSE events immediately
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running geocoding/optimization
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Allow file uploads up to 5MB
        client_max_body_size 5m;
    }

    # Health check for this container
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
