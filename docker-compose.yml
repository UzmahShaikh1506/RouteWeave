# ============================================================
# RouteWeave — Docker Compose Orchestration
#
# Services:
#   db        — PostgreSQL 16 (persistent volume)
#   api       — FastAPI backend (port 8000)
#   optimizer — Route optimization microservice (internal)
#   client    — Nginx serving static files (port 3000)
#
# Usage:
#   cp .env.example .env   # configure secrets
#   docker compose up      # start all services
# ============================================================

services:

  # ─── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: routeweave-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeweave
      POSTGRES_USER: routeweave
      POSTGRES_PASSWORD: ${DB_PASSWORD:-routeweave_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeweave -d routeweave"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - routeweave-net

  # ─── API Service ───────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: routeweave-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://routeweave:${DB_PASSWORD:-routeweave_secret}@db:5432/routeweave
      OPTIMIZER_URL: http://optimizer:8001
    ports:
      - "8000:8000"
    networks:
      - routeweave-net

  # ─── Optimizer Microservice ────────────────────────────────
  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: routeweave-optimizer
    restart: unless-stopped
    networks:
      - routeweave-net

  # ─── Client (Nginx + Static Files) ────────────────────────
  client:
    image: nginx:1.27-alpine
    container_name: routeweave-client
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./client/index.html:/usr/share/nginx/html/index.html:ro
      - ./client/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./client/map.js:/usr/share/nginx/html/map.js:ro
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    networks:
      - routeweave-net

# ─── Volumes ────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

# ─── Networks ───────────────────────────────────────────────
networks:
  routeweave-net:
    driver: bridge
