name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────
  # Stage 1: Run unit tests
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optimizer dependencies
        run: pip install -r optimizer/requirements.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install test dependencies
        run: pip install pytest aiosqlite

      - name: Run optimizer unit tests
        run: pytest tests/test_optimizer.py -v

      - name: Run API unit tests
        run: pytest tests/test_api.py -v

  # ──────────────────────────────────────────────────────────
  # Stage 2: Security scan (DevSecOps)
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image for scanning
        run: docker build -t routeweave-api:scan ./api

      - name: Build Optimizer image for scanning
        run: docker build -t routeweave-optimizer:scan ./optimizer

      - name: Run Trivy scan on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'routeweave-api:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Run Trivy scan on Optimizer image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'routeweave-optimizer:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  # ──────────────────────────────────────────────────────────
  # Stage 3: Build and push container images
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}

      - name: Build and push Optimizer image
        uses: docker/build-push-action@v5
        with:
          context: ./optimizer
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/optimizer:latest
            ${{ env.IMAGE_PREFIX }}/optimizer:${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # Stage 4: Deploy
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deployment triggered successfully."
          else
            echo "No deploy hook configured. Skipping deployment."
          fi
